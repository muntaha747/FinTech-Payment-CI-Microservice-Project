<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 700" width="1100" height="700" role="img" aria-label="07 · Payment Service: SAST and Quality Gate">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#02030a"/><stop offset=".5" stop-color="#05071a"/><stop offset="1" stop-color="#03070f"/></linearGradient>
    <linearGradient id="tg" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fb7185"/><stop offset=".35" stop-color="#fdba74"/><stop offset=".7" stop-color="#4ade80"/><stop offset="1" stop-color="#60a5fa"/></linearGradient>
    <linearGradient id="ggold" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffb800"/><stop offset="1" stop-color="#ffb800" stop-opacity=".78"/></linearGradient><linearGradient id="ggreen" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#16a34a"/><stop offset="1" stop-color="#16a34a" stop-opacity=".78"/></linearGradient><linearGradient id="gindigo" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4338ca"/><stop offset="1" stop-color="#4338ca" stop-opacity=".78"/></linearGradient><linearGradient id="gpink" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#db2777"/><stop offset="1" stop-color="#db2777" stop-opacity=".78"/></linearGradient><linearGradient id="gpurple" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#a21caf"/><stop offset="1" stop-color="#a21caf" stop-opacity=".78"/></linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur in="SourceAlpha" stdDeviation="3" result="b"/><feFlood flood-color="#22d3ee" flood-opacity=".8"/><feComposite in2="b" operator="in" result="h"/><feMerge><feMergeNode in="h"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <style>
      .title { font: 900 30px 'Segoe UI', Arial, sans-serif; fill: url(#tg); }
      .sub { font: 700 15px 'Segoe UI', Arial, sans-serif; fill: #c7d2fe; }
      .ct { font: 900 22px 'Segoe UI', Arial, sans-serif; fill: #000000; }
      .cs { font: 800 16px 'Segoe UI', Arial, sans-serif; fill: #000000; }
      .lbl { font: 900 14px 'Segoe UI', Arial, sans-serif; }
      .foot { font: 700 15px 'Segoe UI', Arial, sans-serif; fill: #c7d2fe; }
      .flow { fill: none; stroke-width: 3.6; stroke-linecap: round; stroke-dasharray: 10 8; animation: flow .8s linear infinite; }
      @keyframes flow { to { stroke-dashoffset: -36; } }
      @media (prefers-reduced-motion: reduce) { .flow { animation: none; } }
    </style>
    <marker id="arr" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L12,6 L0,12 z" fill="#e0f2fe"/></marker>
  </defs>
  <rect width="1100" height="700" fill="url(#bg)"/>
  <text x="550.0" y="44" text-anchor="middle" class="title">07 · Payment Service: SAST and Quality Gate</text>
  <text x="550.0" y="72" text-anchor="middle" class="sub">SonarCloud finds bugs, vulnerabilities and hotspots</text>
  <g class="card" filter="url(#glow)"><rect x="40" y="130" width="230" height="120" rx="14" fill="url(#gindigo)" stroke="#a5b4fc" stroke-width="2.5"/></g>
<text x="155.0" y="188.0" text-anchor="middle" class="ct" style="font-size:22.0px">Inputs</text>
<text x="155.0" y="208.7" text-anchor="middle" class="cs" style="font-size:14.6px">source + coverage + SARIF</text>
<g class="card" filter="url(#glow)"><rect x="310" y="130" width="230" height="120" rx="14" fill="url(#gpurple)" stroke="#e879f9" stroke-width="2.5"/></g>
<text x="425.0" y="188.0" text-anchor="middle" class="ct" style="font-size:22.0px">SAST analysis</text>
<text x="425.0" y="208.7" text-anchor="middle" class="cs" style="font-size:16.0px">bugs, vulns, hotspots</text>
<g class="card" filter="url(#glow)"><rect x="580" y="130" width="230" height="120" rx="14" fill="url(#ggold)" stroke="#fde047" stroke-width="2.5"/></g>
<text x="695.0" y="188.0" text-anchor="middle" class="ct" style="font-size:22.0px">Quality gate</text>
<text x="695.0" y="208.7" text-anchor="middle" class="cs" style="font-size:16.0px">pass / fail rules</text>
<g class="card" filter="url(#glow)"><rect x="850" y="130" width="230" height="120" rx="14" fill="url(#gpink)" stroke="#f472b6" stroke-width="2.5"/></g>
<text x="965.0" y="188.0" text-anchor="middle" class="ct" style="font-size:22.0px">Dashboard</text>
<text x="965.0" y="208.7" text-anchor="middle" class="cs" style="font-size:15.2px">issues, trends, coverage</text>
<g class="card" filter="url(#glow)"><rect x="580" y="305" width="230" height="120" rx="14" fill="url(#ggreen)" stroke="#4ade80" stroke-width="2.5"/></g>
<text x="695.0" y="363.0" text-anchor="middle" class="ct" style="font-size:22.0px">PR decision</text>
<text x="695.0" y="383.7" text-anchor="middle" class="cs" style="font-size:16.0px">pass → merge allowed</text>
<path id="p0" class="flow" d="M270.0,190.0 L310.0,190.0" stroke="#a5b4fc" marker-end="url(#arr)"/>
<path id="p1" class="flow" d="M540.0,190.0 L580.0,190.0" stroke="#e879f9" marker-end="url(#arr)"/>
<path id="p2" class="flow" d="M810.0,190.0 L850.0,190.0" stroke="#fde047" marker-end="url(#arr)"/>
<path id="p3" class="flow" d="M695.0,250.0 L695.0,305.0" stroke="#fde047" marker-end="url(#arr)"/>
<rect x="661.4" y="254.5" width="67.2" height="20" rx="10" fill="#0b1226" stroke="#fde047" stroke-width="2"/>
<text x="695.0" y="267.5" text-anchor="middle" class="lbl" fill="#fde047">result</text>
  <text x="550.0" y="648" text-anchor="middle" class="foot">The quality gate result shows on the run and the dashboard</text><text x="550.0" y="670" text-anchor="middle" class="foot">Rules cover coverage, duplication and new issues</text><text x="550.0" y="692" text-anchor="middle" class="foot">Gate decides whether the change is ready for main</text>
  <circle r="7" fill="#a5b4fc" opacity="1" filter="url(#glow)"><animateMotion dur="2.20s" repeatCount="indefinite" begin="0.00s"><mpath href="#p0"/></animateMotion></circle>
<circle r="5" fill="#a5b4fc" opacity="0.6" filter="url(#glow)"><animateMotion dur="2.20s" repeatCount="indefinite" begin="-0.18s"><mpath href="#p0"/></animateMotion></circle>
<circle r="3.5" fill="#a5b4fc" opacity="0.35" filter="url(#glow)"><animateMotion dur="2.20s" repeatCount="indefinite" begin="-0.36s"><mpath href="#p0"/></animateMotion></circle>
<circle r="7" fill="#e879f9" opacity="1" filter="url(#glow)"><animateMotion dur="2.55s" repeatCount="indefinite" begin="0.30s"><mpath href="#p1"/></animateMotion></circle>
<circle r="5" fill="#e879f9" opacity="0.6" filter="url(#glow)"><animateMotion dur="2.55s" repeatCount="indefinite" begin="0.12s"><mpath href="#p1"/></animateMotion></circle>
<circle r="3.5" fill="#e879f9" opacity="0.35" filter="url(#glow)"><animateMotion dur="2.55s" repeatCount="indefinite" begin="-0.06s"><mpath href="#p1"/></animateMotion></circle>
<circle r="7" fill="#fde047" opacity="1" filter="url(#glow)"><animateMotion dur="2.90s" repeatCount="indefinite" begin="0.60s"><mpath href="#p2"/></animateMotion></circle>
<circle r="5" fill="#fde047" opacity="0.6" filter="url(#glow)"><animateMotion dur="2.90s" repeatCount="indefinite" begin="0.42s"><mpath href="#p2"/></animateMotion></circle>
<circle r="3.5" fill="#fde047" opacity="0.35" filter="url(#glow)"><animateMotion dur="2.90s" repeatCount="indefinite" begin="0.24s"><mpath href="#p2"/></animateMotion></circle>
<circle r="7" fill="#fde047" opacity="1" filter="url(#glow)"><animateMotion dur="3.25s" repeatCount="indefinite" begin="0.90s"><mpath href="#p3"/></animateMotion></circle>
<circle r="5" fill="#fde047" opacity="0.6" filter="url(#glow)"><animateMotion dur="3.25s" repeatCount="indefinite" begin="0.72s"><mpath href="#p3"/></animateMotion></circle>
<circle r="3.5" fill="#fde047" opacity="0.35" filter="url(#glow)"><animateMotion dur="3.25s" repeatCount="indefinite" begin="0.54s"><mpath href="#p3"/></animateMotion></circle>
</svg>
