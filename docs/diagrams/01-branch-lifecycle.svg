<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 740" width="1100" height="740" role="img" aria-label="01 · Payment Service: Branch Lifecycle">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#02030a"/><stop offset=".5" stop-color="#05071a"/><stop offset="1" stop-color="#03070f"/></linearGradient>
    <linearGradient id="tg" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fb7185"/><stop offset=".35" stop-color="#fdba74"/><stop offset=".7" stop-color="#4ade80"/><stop offset="1" stop-color="#60a5fa"/></linearGradient>
    <linearGradient id="gblue" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1d6bff"/><stop offset="1" stop-color="#1d6bff" stop-opacity=".78"/></linearGradient><linearGradient id="ggold" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffb800"/><stop offset="1" stop-color="#ffb800" stop-opacity=".78"/></linearGradient><linearGradient id="ggreen" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#16a34a"/><stop offset="1" stop-color="#16a34a" stop-opacity=".78"/></linearGradient><linearGradient id="gindigo" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4338ca"/><stop offset="1" stop-color="#4338ca" stop-opacity=".78"/></linearGradient><linearGradient id="gpink" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#db2777"/><stop offset="1" stop-color="#db2777" stop-opacity=".78"/></linearGradient><linearGradient id="gpurple" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#a21caf"/><stop offset="1" stop-color="#a21caf" stop-opacity=".78"/></linearGradient><linearGradient id="gsky" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0ea5e9"/><stop offset="1" stop-color="#0ea5e9" stop-opacity=".78"/></linearGradient><linearGradient id="gteal" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0d9488"/><stop offset="1" stop-color="#0d9488" stop-opacity=".78"/></linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur in="SourceAlpha" stdDeviation="3" result="b"/><feFlood flood-color="#22d3ee" flood-opacity=".8"/><feComposite in2="b" operator="in" result="h"/><feMerge><feMergeNode in="h"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <style>
      .title { font: 900 30px 'Segoe UI', Arial, sans-serif; fill: url(#tg); }
      .sub { font: 700 15px 'Segoe UI', Arial, sans-serif; fill: #c7d2fe; }
      .ct { font: 900 22px 'Segoe UI', Arial, sans-serif; fill: #000000; }
      .cs { font: 800 16px 'Segoe UI', Arial, sans-serif; fill: #000000; }
      .lbl { font: 900 14px 'Segoe UI', Arial, sans-serif; }
      .foot { font: 700 15px 'Segoe UI', Arial, sans-serif; fill: #c7d2fe; }
      .flow { fill: none; stroke-width: 3.6; stroke-linecap: round; stroke-dasharray: 10 8; animation: flow .8s linear infinite; }
      @keyframes flow { to { stroke-dashoffset: -36; } }
      @media (prefers-reduced-motion: reduce) { .flow { animation: none; } }
    </style>
    <marker id="arr" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L12,6 L0,12 z" fill="#e0f2fe"/></marker>
  </defs>
  <rect width="1100" height="740" fill="url(#bg)"/>
  <text x="550.0" y="44" text-anchor="middle" class="title">01 · Payment Service: Branch Lifecycle</text>
  <text x="550.0" y="72" text-anchor="middle" class="sub">Read from the bottom up: feature → pull request → main</text>
  <g class="card" filter="url(#glow)"><rect x="310" y="130" width="230" height="120" rx="14" fill="url(#ggreen)" stroke="#4ade80" stroke-width="2.5"/></g>
<text x="425.0" y="188.0" text-anchor="middle" class="ct" style="font-size:22.0px">main (trunk)</text>
<text x="425.0" y="208.7" text-anchor="middle" class="cs" style="font-size:14.6px">PR merged → CI runs again</text>
<g class="card" filter="url(#glow)"><rect x="310" y="305" width="230" height="120" rx="14" fill="url(#gblue)" stroke="#60a5fa" stroke-width="2.5"/></g>
<text x="425.0" y="363.0" text-anchor="middle" class="ct" style="font-size:16.4px">Pull request → main</text>
<text x="425.0" y="378.9" text-anchor="middle" class="cs" style="font-size:16.0px">runs on every update</text>
<g class="card" filter="url(#glow)"><rect x="310" y="480" width="230" height="120" rx="14" fill="url(#gpurple)" stroke="#e879f9" stroke-width="2.5"/></g>
<text x="425.0" y="538.0" text-anchor="middle" class="ct" style="font-size:22.0px">feature branch</text>
<text x="425.0" y="558.7" text-anchor="middle" class="cs" style="font-size:16.0px">git push → CI runs</text>
<g class="card" filter="url(#glow)"><rect x="40" y="480" width="230" height="120" rx="14" fill="url(#gindigo)" stroke="#a5b4fc" stroke-width="2.5"/></g>
<text x="155.0" y="538.0" text-anchor="middle" class="ct" style="font-size:22.0px">Developer</text>
<text x="155.0" y="558.7" text-anchor="middle" class="cs" style="font-size:16.0px">writes code, pushes</text>
<g class="card" filter="url(#glow)"><rect x="40" y="305" width="230" height="120" rx="14" fill="url(#gsky)" stroke="#38bdf8" stroke-width="2.5"/></g>
<text x="155.0" y="363.0" text-anchor="middle" class="ct" style="font-size:22.0px">Reviewer / QA</text>
<text x="155.0" y="383.7" text-anchor="middle" class="cs" style="font-size:16.0px">reviews and merges</text>
<g class="card" filter="url(#glow)"><rect x="40" y="130" width="230" height="120" rx="14" fill="url(#gteal)" stroke="#2dd4bf" stroke-width="2.5"/></g>
<text x="155.0" y="188.0" text-anchor="middle" class="ct" style="font-size:22.0px">GitHub Actions</text>
<text x="155.0" y="208.7" text-anchor="middle" class="cs" style="font-size:15.9px">same steps on every run</text>
<g class="card" filter="url(#glow)"><rect x="580" y="480" width="230" height="120" rx="14" fill="url(#ggold)" stroke="#fde047" stroke-width="2.5"/></g>
<text x="695.0" y="538.0" text-anchor="middle" class="ct" style="font-size:22.0px">Functional env</text>
<text x="695.0" y="558.7" text-anchor="middle" class="cs" style="font-size:16.0px">fb- image</text>
<g class="card" filter="url(#glow)"><rect x="580" y="305" width="230" height="120" rx="14" fill="url(#ggold)" stroke="#fde047" stroke-width="2.5"/></g>
<text x="695.0" y="363.0" text-anchor="middle" class="ct" style="font-size:20.8px">Functional (PR)</text>
<text x="695.0" y="382.7" text-anchor="middle" class="cs" style="font-size:16.0px">PR feedback</text>
<g class="card" filter="url(#glow)"><rect x="580" y="130" width="230" height="120" rx="14" fill="url(#gpink)" stroke="#f472b6" stroke-width="2.5"/></g>
<text x="695.0" y="188.0" text-anchor="middle" class="ct" style="font-size:13.0px">Regression + Integration</text>
<text x="695.0" y="201.0" text-anchor="middle" class="cs" style="font-size:16.0px">rel- image after merge</text>
<path id="p0" class="flow" d="M270.0,540.0 L310.0,540.0" stroke="#a5b4fc" marker-end="url(#arr)"/>
<rect x="265.6" y="517.0" width="48.8" height="20" rx="10" fill="#0b1226" stroke="#a5b4fc" stroke-width="2"/>
<text x="290.0" y="530.0" text-anchor="middle" class="lbl" fill="#a5b4fc">push</text>
<path id="p1" class="flow" d="M425.0,480.0 L425.0,425.0" stroke="#60a5fa" marker-end="url(#arr)"/>
<rect x="386.8" y="429.5" width="76.4" height="20" rx="10" fill="#0b1226" stroke="#60a5fa" stroke-width="2"/>
<text x="425.0" y="442.5" text-anchor="middle" class="lbl" fill="#60a5fa">open PR</text>
<path id="p2" class="flow" d="M425.0,305.0 L425.0,250.0" stroke="#4ade80" marker-end="url(#arr)"/>
<rect x="396.0" y="254.5" width="58.0" height="20" rx="10" fill="#0b1226" stroke="#4ade80" stroke-width="2"/>
<text x="425.0" y="267.5" text-anchor="middle" class="lbl" fill="#4ade80">merge</text>
<path id="p3" class="flow" d="M270.0,365.0 L310.0,365.0" stroke="#38bdf8" marker-end="url(#arr)"/>
<rect x="256.4" y="342.0" width="67.2" height="20" rx="10" fill="#0b1226" stroke="#38bdf8" stroke-width="2"/>
<text x="290.0" y="355.0" text-anchor="middle" class="lbl" fill="#38bdf8">review</text>
<path id="p4" class="flow" d="M270.0,190.0 L310.0,190.0" stroke="#2dd4bf" marker-end="url(#arr)"/>
<rect x="265.6" y="167.0" width="48.8" height="20" rx="10" fill="#0b1226" stroke="#2dd4bf" stroke-width="2"/>
<text x="290.0" y="180.0" text-anchor="middle" class="lbl" fill="#2dd4bf">runs</text>
<path id="p5" class="flow" d="M540.0,540.0 L580.0,540.0" stroke="#fde047" marker-end="url(#arr)"/>
<rect x="540.2" y="517.0" width="39.6" height="20" rx="10" fill="#0b1226" stroke="#fde047" stroke-width="2"/>
<text x="560.0" y="530.0" text-anchor="middle" class="lbl" fill="#fde047">fb-</text>
<path id="p6" class="flow" d="M540.0,365.0 L580.0,365.0" stroke="#fde047" marker-end="url(#arr)"/>
<rect x="544.8" y="342.0" width="30.4" height="20" rx="10" fill="#0b1226" stroke="#fde047" stroke-width="2"/>
<text x="560.0" y="355.0" text-anchor="middle" class="lbl" fill="#fde047">PR</text>
<path id="p7" class="flow" d="M540.0,190.0 L580.0,190.0" stroke="#f472b6" marker-end="url(#arr)"/>
<rect x="535.6" y="167.0" width="48.8" height="20" rx="10" fill="#0b1226" stroke="#f472b6" stroke-width="2"/>
<text x="560.0" y="180.0" text-anchor="middle" class="lbl" fill="#f472b6">rel-</text>
  <text x="550.0" y="688" text-anchor="middle" class="foot">Feature first, then PR, then main</text><text x="550.0" y="710" text-anchor="middle" class="foot">Deploys: functional on push / PR, regression + integration on merge</text>
